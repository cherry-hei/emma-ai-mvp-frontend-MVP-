# Deploy the Emma AI REST API (FastAPI) to AWS ECS Express Mode.
#
# Flow: build repo-root Dockerfile -> push image to ECR -> create/update the
# ECS Express Gateway service. Everything is read from repository VARIABLES
# (Settings -> Secrets and variables -> Actions -> Variables tab); no secret
# values live in GitHub - only Secrets Manager ARNs, which are identifiers.
#
# Auth: OIDC AssumeRole (no long-lived AWS keys). The IAM role
# `github-actions-emma-api` trusts this repo on branch `main` only.
# See SETUP_BACKEND_AWS.md for the full setup guide.

name: Deploy API to AWS

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "emma-ai-app/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

# `emma-ai-app/**` already covers supabase/migrations/**, so a migration-only
# commit triggers a deploy. That is intended: a schema change with no code change
# still has to reach the database, and until 1 Aug 2026 nothing ever did.

permissions:
  id-token: write # OIDC token for AssumeRoleWithWebIdentity
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-emma-api
          aws-region: ${{ vars.AWS_REGION }}

      # ── database migrations ─────────────────────────────────────────────
      # Before the image, not after. Migrations here are additive, so new schema
      # with old code is harmless for the minute it lasts; new code against old
      # schema is the 500s we spent a month chasing. If the push fails the job
      # stops and nothing ships.
      #
      # The URL is read from Secrets Manager rather than duplicated as a GitHub
      # secret, so there is one copy of the production password and rotating it
      # is one action. Requires `secretsmanager:GetSecretValue` on
      # SECRET_ARN_DATABASE_URL in the github-actions-emma-api role - see
      # SETUP_BACKEND_AWS.md.
      - name: Read DATABASE_URL from Secrets Manager
        id: dburl
        env:
          SECRET_ARN_DATABASE_URL: ${{ vars.SECRET_ARN_DATABASE_URL }}
        run: |
          set -euo pipefail
          URL=$(aws secretsmanager get-secret-value \
                  --secret-id "$SECRET_ARN_DATABASE_URL" \
                  --region "$AWS_REGION" \
                  --query SecretString --output text)
          # Mask before it can reach a log line, including on a later failure.
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pre-flight - would any migration collide with live data?
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
        run: |
          set -euo pipefail
          pip install --quiet "psycopg[binary]>=3.2"
          # Read-only. Exits 1 on a duplicate that would abort the push half-way
          # through and leave the schema version lying about what is applied.
          python emma-ai-app/scripts/preflight_migrations.py

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.dburl.outputs.url }}
        working-directory: emma-ai-app
        run: |
          set -euo pipefail
          # --db-url avoids `supabase link`, so CI needs no personal access token
          # and no project ref - just the connection string it already has.
          # Session pooler (5432), never the transaction pooler (6543): DDL and
          # advisory locks do not survive transaction pooling.
          supabase db push --db-url "$DATABASE_URL" --include-all
          echo "--- migrations now applied ---"
          supabase migration list --db-url "$DATABASE_URL"

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          # Also move the :latest tag for convenience.
          docker tag "$IMAGE_URI" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Create or update ECS Express Gateway service
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          APP_ENV: ${{ vars.APP_ENV }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          SECRET_ARN_SERVICE_ROLE_KEY: ${{ vars.SECRET_ARN_SERVICE_ROLE_KEY }}
          SECRET_ARN_DATABASE_URL: ${{ vars.SECRET_ARN_DATABASE_URL }}
        run: |
          set -euo pipefail

          EXEC_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsTaskExecutionRole"
          INFRA_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/ecsInfrastructureRoleForExpressServices"
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${ECS_CLUSTER}/${ECS_SERVICE}"

          # The COMPLETE set of env vars and secrets. Never remove an entry to
          # "keep the old value" - anything absent is dropped from the new task
          # definition (see SETUP_BACKEND_AWS.md -> Changing configuration later).
          #
          # Built with jq, not a heredoc. A repository variable pasted through the
          # GitHub UI can carry a trailing newline, and interpolating one into a
          # hand-written JSON string produces a literal control character inside
          # the quotes: `aws` then rejects the whole --primary-container with
          # "Invalid control character", after the image has already been pushed.
          # That is exactly how the 1 Aug deploy failed on CORS_ORIGINS. jq quotes
          # and escapes every value, and `tr -d '\r\n'` strips the stray newline
          # rather than escaping it into the container's environment.
          clean() { printf '%s' "${1-}" | tr -d '\r\n'; }

          ENVIRONMENT=$(jq -cn \
            --arg app_env      "$(clean "$APP_ENV")" \
            --arg supabase_url "$(clean "$SUPABASE_URL")" \
            --arg anon_key     "$(clean "$SUPABASE_ANON_KEY")" \
            --arg cors         "$(clean "$CORS_ORIGINS")" \
            '[{name: "APP_ENV",           value: $app_env},
              {name: "SUPABASE_URL",      value: $supabase_url},
              {name: "SUPABASE_ANON_KEY", value: $anon_key},
              {name: "CORS_ORIGINS",      value: $cors},
              {name: "PORT",              value: "8080"}]')

          SECRETS=$(jq -cn \
            --arg service_role "$(clean "$SECRET_ARN_SERVICE_ROLE_KEY")" \
            --arg database_url "$(clean "$SECRET_ARN_DATABASE_URL")" \
            '[{name: "SUPABASE_SERVICE_ROLE_KEY", valueFrom: $service_role},
              {name: "DATABASE_URL",              valueFrom: $database_url}]')

          PRIMARY_CONTAINER=$(jq -cn \
            --arg image "$(clean "$IMAGE_URI")" \
            --argjson environment "$ENVIRONMENT" \
            --argjson secrets "$SECRETS" \
            '{image: $image, containerPort: 8080,
              environment: $environment, secrets: $secrets}')

          if aws ecs describe-express-gateway-service \
               --service-arn "$SERVICE_ARN" --region "$AWS_REGION" \
               >/dev/null 2>&1; then
            echo "Service exists - updating..."
            aws ecs update-express-gateway-service \
              --service-arn "$SERVICE_ARN" \
              --region "$AWS_REGION" \
              --primary-container "$PRIMARY_CONTAINER" \
              --execution-role-arn "$EXEC_ROLE_ARN" \
              --health-check-path /health \
              --scaling-target '{"minTaskCount": 1, "maxTaskCount": 1}'
          else
            echo "Service not found - creating..."
            aws ecs create-express-gateway-service \
              --service-name "$ECS_SERVICE" \
              --cluster "$ECS_CLUSTER" \
              --region "$AWS_REGION" \
              --primary-container "$PRIMARY_CONTAINER" \
              --execution-role-arn "$EXEC_ROLE_ARN" \
              --infrastructure-role-arn "$INFRA_ROLE_ARN" \
              --health-check-path /health \
              --scaling-target '{"minTaskCount": 1, "maxTaskCount": 1}'
          fi

      - name: Wait for the new image to actually be serving
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail
          SERVICE_ARN="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:service/${ECS_CLUSTER}/${ECS_SERVICE}"

          # This step used to wait on `service.status == ACTIVE` and stop there.
          # ACTIVE describes the service, which was already active before the
          # deploy - so the loop broke on its first poll and the job went green
          # while the previous image was still answering requests. On 1 Aug the
          # pipeline reported a successful deploy and the old build served for
          # at least five minutes afterwards. A deploy step that cannot tell
          # "shipped" from "exists" is worse than no check at all, because
          # someone reads the tick and tells the client it is live.
          #
          # So the gate is now the running container's image digest.
          echo "Waiting for the service to report ${IMAGE_URI}..."
          DEPLOYED=""
          for i in $(seq 1 60); do
            DESCRIBE=$(aws ecs describe-express-gateway-service \
              --service-arn "$SERVICE_ARN" --region "$AWS_REGION" 2>/dev/null || echo '{}')
            # `service.status` is an object - {"statusCode": "ACTIVE"} - not a
            # string. The old step read it with `--query service.status --output
            # text`, which flattened it to ACTIVE and hid the shape.
            STATUS=$(printf '%s' "$DESCRIBE" | jq -r '
              .service.status | if type == "object" then (.statusCode // "UNKNOWN")
              else (. // "PENDING") end')
            RUNNING=$(printf '%s' "$DESCRIBE" | jq -r '
              [.. | objects | .image? // empty] | first // ""')
            echo "[$i/60] status: ${STATUS}  image: ${RUNNING:-unknown}"
            if [ "$STATUS" = "ACTIVE" ] && [ "$RUNNING" = "$IMAGE_URI" ]; then
              DEPLOYED="yes"
              break
            fi
            sleep 20
          done

          # The endpoint field was queried as `service.ingressPaths[0].endpoint`,
          # which resolved to None - the shape is not what that path assumed, and
          # a wrong guess printed as "Service endpoint: None" under a green tick.
          # Search the response for the first URL rather than guessing again, and
          # dump the whole document when nothing is found so the next run has the
          # schema in the log instead of another silent None.
          URL=$(printf '%s' "$DESCRIBE" | jq -r '
            [.. | strings | select(startswith("http"))] | first // ""')
          echo "=================================================="
          if [ -n "$URL" ]; then
            echo "Service endpoint: $URL"
            echo "Health:           $(curl -fsS --max-time 20 "$URL/health" || echo unreachable)"
          else
            echo "Service endpoint could not be read. Full describe response:"
            printf '%s\n' "$DESCRIBE" | jq '.'
          fi
          echo "=================================================="

          if [ -z "$DEPLOYED" ]; then
            echo "::error::The service is not serving ${IMAGE_URI}. The image was" \
                 "built and pushed, but the rollout did not complete - do not" \
                 "report this deploy as live."
            exit 1
          fi
